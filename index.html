<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>💨</text></svg>">    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {
        delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ]
    });"></script>
    <title>빵구노트</title>
    <style>
    body {
        font-family: 'Malgun Gothic', sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        line-height: 2.2;
        margin: 0;
        padding: 0px;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        background: #1e1e1e;
        padding: 15px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
        color: #ffffff;
    }
    .tab-menu {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 8px;
        margin-bottom: 30px;
        border-bottom: 2px solid #333;
        padding-bottom: 15px;
        overflow-x: auto;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
    }
    .tab-menu::-webkit-scrollbar {
        height: 6px;
    }
    .tab-menu::-webkit-scrollbar-thumb {
        background: #444;
        border-radius: 3px;
    }
    .tab-btn {
        background-color: #2c2c2c;
        border: none;
        padding: 10px 16px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        border-radius: 6px;
        transition: all 0.2s;
        color: #b0b0b0;
        flex-shrink: 0;
    }
    .tab-btn:hover {
        background-color: #383838;
        color: #ffffff;
    }
    .tab-btn.active {
        background-color: #3498db;
        color: white;
    }
    .tab-content {
        display: none;
    }
    .tab-content.active {
        display: block;
    }
    .concept-title {
        font-weight: bold;
        font-size: 18px;
        margin-top: 30px;
        margin-bottom: 10px;
        color: #5dade2;
        border-bottom: 2px solid #333;
        padding-bottom: 5px;
    }
    p {
        margin: 12px 0;
        font-size: clamp(14px, 2vw, 16px);
        text-align: justify;
    }
    .blank {
        display: inline-block;
        background-color: #2b3e50;
        color: #85c1e9;
        border: 1px dashed #5499c7;
        padding: 0 8px;
        margin: 0 2px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s;
        user-select: none;
    }
    .blank:hover {
        background-color: #34495e;
    }
    .blank.hidden {
        background-color: #3a3520;
        color: #f39c12;
        border: 1px solid #d4ac0d;
    }
    .katex-display, 
    mjx-container[display="true"] {
        overflow-x: auto !important;
        overflow-y: hidden !important;
        max-width: 100%;
        padding: 4px 0;
        scrollbar-color: #888 #f1f1f1;
        scrollbar-width: thin;
        font-size: 88% !important;
        margin: 0.8em 0 !important;
    }
    .swipeable-card {
    transition: transform 0.3s ease, opacity 0.3s ease;
    touch-action: pan-y;
    position: relative;
    }
    .swiped-out {
        opacity: 0;
        transform: translateX(100%);
        max-height: 0 !important;
        margin-bottom: 0 !important;
        overflow: hidden;
    }
    </style>
</head>
<body>

<div class="container">
    <h1 onclick="location.reload()" style="cursor: pointer;">수학임용 빵구💨노트</h1>
    
    <!-- 실시간 검색바 영역 -->
    <div style="margin-bottom: 20px;">
        <input type="text" id="searchInput" placeholder="🔍 키워드 검색" onkeyup="filterContent()" style="
            width: 100%;
            padding: 12px 16px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        ">
    </div>

    <!-- 탭 메뉴 버튼 -->
    <div class="tab-menu">
        <button class="tab-btn active" onclick="switchTab('tab1', event)">교수·학습 방법</button>
        <button class="tab-btn" onclick="switchTab('tab2', event)">수와 연산</button>
        <button class="tab-btn" onclick="switchTab('tab3', event)">변화와 관계</button>
        <button class="tab-btn" onclick="switchTab('tab4', event)">도형과 측정</button>
        <button class="tab-btn" onclick="switchTab('tab5', event)">자료와 가능성</button>
        <button class="tab-btn" onclick="switchTab('tab6', event)">고등학교</button>
        <button class="tab-btn" onclick="switchTab('tab-edumath', event)">수교론</button>
        <button class="tab-btn" onclick="switchTab('tab-edu', event)">교육학</button>
        <button class="tab-btn" onclick="switchTab('tab-math', event)">내용학</button>
    </div>

    <!-- 탭: 교수·학습 방법 -->
    <div id="tab1" class="tab-content">
        <div class="sub-tab-menu" style="display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0; padding-bottom: 5px;">
            <button class="sub-tab-btn active" onclick="filterPedagogy('수학교과역량', event)" style="background-color: #3498db; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">수학교과역량</button>
            <button class="sub-tab-btn" onclick="filterPedagogy('교수학습방안', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">교수학습방안</button>
            <button class="sub-tab-btn" onclick="filterPedagogy('평가방향', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">평가방향</button>
            <button class="sub-tab-btn" onclick="filterPedagogy('평가방안', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">평가방안</button>
            <button class="sub-tab-btn" onclick="filterPedagogy('기타', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">기타</button>
        </div>
        <div id="pedagogy-list-container" style="margin-top: 20px;"></div>
    </div>

    <!-- 탭 2: 수와 연산 -->
    <div id="tab2" class="tab-content"></div>

    <!-- 탭 3: 변화와 관계 -->
    <div id="tab3" class="tab-content"></div>

    <!-- 탭 4: 도형과 측정 -->
    <div id="tab4" class="tab-content"></div>

    <!-- 탭 5: 자료와 가능성 -->
    <div id="tab5" class="tab-content"></div>

    <!-- 탭 6: 고등학교 -->
    <div id="tab6" class="tab-content"></div>

    <!-- 탭: 수교론 암기 -->
    <div id="tab-edumath" class="tab-content">
        <div class="concept-title">🧩 수교론 핵심 키워드 암기 카드</div>
        <div style="text-align: center; margin-bottom: 20px;">
            <button onclick="shuffleCards()" style="background-color: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">🔀 랜덤 섞기</button>
            <button onclick="resetCards()" style="background-color: #555; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">🔄 기본 정렬</button>
            <button id="toggleHiddenBtn" onclick="toggleShowHiddenCards()" style="background-color: #2c2c2c; color: #b0b0b0; border: 1px solid #444; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s;">👓 숨김 (OFF)</button>
        </div>
        <div id="card-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;"></div>
    </div>

    <!-- 탭: 교육학 암기 카드 -->
    <div id="tab-edu" class="tab-content">
        <div class="concept-title">📚 교육학 핵심 키워드 암기 카드</div>
        <div style="text-align: center; margin-bottom: 20px;">
            <button onclick="shuffleEduCards()" style="background-color: #3498db; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">🔀 랜덤 섞기</button>
            <button onclick="resetEduCards()" style="background-color: #555; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">🔄 기본 정렬</button>
            <button id="toggleEduHiddenBtn" onclick="toggleShowHiddenEduCards()" style="background-color: #2c2c2c; color: #b0b0b0; border: 1px solid #444; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s;">👓 숨김 (OFF)</button>
        </div>
        <div id="edu-card-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;"></div>
    </div>

    <!-- 탭: 내용학 공식 요약 노트 -->
    <div id="tab-math" class="tab-content">
        <div class="concept-title">📐 자주 잊어버리는 정의정리</div>
        <div class="sub-tab-menu" style="display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0; padding-bottom: 5px;">
            <button class="sub-tab-btn active" onclick="filterFormulas('all', event)" style="background-color: #3498db; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">전체 보기</button>
            <button class="sub-tab-btn" onclick="filterFormulas('미적', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">미적</button>
            <button class="sub-tab-btn" onclick="filterFormulas('해석', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">해석</button>
            <button class="sub-tab-btn" onclick="filterFormulas('대수', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">대수</button>
            <button class="sub-tab-btn" onclick="filterFormulas('위상', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">위상</button>
            <button class="sub-tab-btn" onclick="filterFormulas('복소', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">복소</button>
            <button class="sub-tab-btn" onclick="filterFormulas('미기', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">미기</button>
            <button class="sub-tab-btn" onclick="filterFormulas('정수', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">정수</button>
            <button class="sub-tab-btn" onclick="filterFormulas('선대', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">선대</button>
            <button class="sub-tab-btn" onclick="filterFormulas('이산', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">이산</button>
            <button class="sub-tab-btn" onclick="filterFormulas('확통', event)" style="background-color: #2c2c2c; color: #b0b0b0; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px;">확통</button>
        </div>
        <div id="formula-list-container" style="margin-top: 20px;"></div>
    </div>
</div>

<script src="mathedu-data.js"></script>
<script src="edu-data.js"></script>
<script src="content-data.js"></script>
<script src="curriculum-data.js"></script>

<script>
    let cardsData = [...originalCardsData];
    let eduCardsData = [...originalEduCardsData];
    let showHiddenMode = false;

    function toggleShowHiddenCards() {
        showHiddenMode = !showHiddenMode;
        const btn = document.getElementById('toggleHiddenBtn');
        if (showHiddenMode) {
            btn.style.backgroundColor = '#3498db';
            btn.style.color = 'white';
            btn.style.borderColor = '#3498db';
            btn.textContent = '👓 숨김 (ON)';
        } else {
            btn.style.backgroundColor = '#2c2c2c';
            btn.style.color = '#b0b0b0';
            btn.style.borderColor = '#444';
            btn.textContent = '👓 숨김 (OFF)';
        }
        const openedAnswers = [];
        document.querySelectorAll('#card-container > div').forEach((card, idx) => {
            const ansDiv = card.querySelector('.card-answer, .edu-card-answer');
            if (ansDiv && ansDiv.style.display === 'block') {
                openedAnswers.push(card.getAttribute('data-original-index'));
            }
        });

        renderCards();
        document.querySelectorAll('#card-container > div').forEach(card => {
            const origIdx = card.getAttribute('data-original-index');
            if (origIdx !== null && openedAnswers.includes(origIdx)) {
                const ansDiv = card.querySelector('.card-answer, .edu-card-answer');
                if (ansDiv) ansDiv.style.display = 'block';
            }
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedTab = localStorage.getItem('selectedTab');
        const savedScroll = localStorage.getItem('scrollPos');

        if (savedTab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            const targetTab = document.getElementById(savedTab);
            if (targetTab) targetTab.classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(`('${savedTab}',`)) {
                    btn.classList.add('active');
                }
            });
        }

        if (savedScroll) {
            setTimeout(() => {
                window.scrollTo(0, parseInt(savedScroll));
            }, 100);
        }

        const savedPedagogyCategory = localStorage.getItem('selectedPedagogyCategory');
        if (savedPedagogyCategory) {
            currentPedagogyCategory = savedPedagogyCategory;
            document.querySelectorAll('#tab1 .sub-tab-btn').forEach(btn => {
                if (btn.getAttribute('onclick').includes(`'${savedPedagogyCategory}'`)) {
                    btn.classList.add('active');
                    btn.style.backgroundColor = '#3498db';
                    btn.style.color = 'white';
                } else {
                    btn.classList.remove('active');
                    btn.style.backgroundColor = '#2c2c2c';
                    btn.style.color = '#b0b0b0';
                }
            });
        }
        if (document.getElementById('tab2') && window.tab2Data) document.getElementById('tab2').innerHTML = window.tab2Data;
        if (document.getElementById('tab3') && window.tab3Data) document.getElementById('tab3').innerHTML = window.tab3Data;
        if (document.getElementById('tab4') && window.tab4Data) document.getElementById('tab4').innerHTML = window.tab4Data;
        if (document.getElementById('tab5') && window.tab5Data) document.getElementById('tab5').innerHTML = window.tab5Data;
        if (document.getElementById('tab6') && window.tab6Data) document.getElementById('tab6').innerHTML = window.tab6Data;

        if (window.renderMathInElement) {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }

        renderPedagogyList();
        renderCards();
        renderEduCards();
        renderFormulaList();
    });

    window.addEventListener('scroll', () => {
        localStorage.setItem('scrollPos', window.scrollY);
    });

    function switchTab(tabId, event) {
        localStorage.setItem('selectedTab', tabId);
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById(tabId).classList.add('active');
        if (event && event.currentTarget) {
            event.currentTarget.classList.add('active');
        }

        if (window.renderMathInElement && targetTab) {
            renderMathInElement(targetTab, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }

        const searchKeyword = document.getElementById('searchInput').value.trim();
        if (searchKeyword !== '') {
            filterContent();
        }
    }

    document.addEventListener('click', (event) => {
        const el = event.target;
        if (el.classList.contains('blank')) {
            const answer = el.getAttribute('data-answer');
            if (el.classList.contains('hidden')) {
                el.textContent = answer;
                el.classList.remove('hidden');
            } else {
                el.textContent = '[□□]';
                el.classList.add('hidden');
            }
        }
    });

    document.querySelectorAll('.tab-content:not(#tab1) .blank').forEach(el => {
        if (!el.textContent.includes('□')) {
            el.textContent = '[□□]';
        }
    });

function renderCards() {
        const container = document.getElementById('card-container');
        if (!container) return;
        const openedOriginalIndices = [];
        document.querySelectorAll('#card-container > div').forEach(card => {
            const ansDiv = card.querySelector('.card-answer, .edu-card-answer');
            const origIdx = card.getAttribute('data-original-index');
            if (ansDiv && ansDiv.style.display === 'block' && origIdx !== null) {
                openedOriginalIndices.push(parseInt(origIdx, 10));
            }
        });

        container.innerHTML = '';

        const searchInput = document.getElementById('searchInput');
        const searchKeyword = searchInput ? searchInput.value.toLowerCase().trim().replace(/\s+/g, '') : '';

        let visibleCards = cardsData.filter((item) => {
            const origIndex = originalCardsData.indexOf(item);
            const isHidden = hiddenCards.has(origIndex);
            const cardText = (item.q + item.a).toLowerCase().replace(/\s+/g, '');
            const isMatch = searchKeyword === '' || cardText.includes(searchKeyword);

            if (isHidden && searchKeyword === '' && !showHiddenMode) return false;
            if (!isMatch) return false;
            return true;
        });

        if (visibleCards.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: #7f8c8d; padding: 20px; grid-column: 1 / -1;">조건에 맞는 카드가 없습니다!</div>`;
            return;
        }

        visibleCards.forEach((item, index) => {
            const origIndex = originalCardsData.indexOf(item);
            const isHidden = hiddenCards.has(origIndex);

            const card = document.createElement('div');
            card.setAttribute('data-original-index', origIndex);
            
            card.style.cssText = `
                background-color: #252525;
                border: ${isHidden ? '1.5px dashed #f39c12' : '1px solid #333'};
                border-radius: 8px;
                padding: 20px;
                cursor: pointer;
                transition: all 0.2s;
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 120px;
                position: relative;
            `;
            
            card.innerHTML = `
                <div style="font-size: 13px; color: #85c1e9; margin-bottom: 8px; font-weight: bold;">
                    Q${index + 1}. ${isHidden ? '<span style="color:#f39c12; font-size:11px;">(숨김)</span>' : ''}
                </div>
                <div style="font-size: 15px; color: #ffffff; font-weight: bold; margin-bottom: 12px; text-align: center;">${item.q}</div>
                <div class="card-answer" style="font-size: 14px; color: #f39c12; background-color: #1a1a1a; padding: 10px; border-radius: 4px; text-align: center; display: none; border: 1px dashed #d4ac0d;">
                    💡 ${item.a}
                </div>
                <div style="font-size: 11px; color: #7f8c8d; text-align: center; margin-top: 8px;">클릭하여 정답 확인</div>
            `;

            const ansDiv = card.querySelector('.card-answer, .edu-card-answer');
            if (openedOriginalIndices.includes(origIndex)) {
                ansDiv.style.display = 'block';
            }

            card.addEventListener('click', () => {
                if (ansDiv.style.display === 'none' || ansDiv.style.display === '') {
                    ansDiv.style.display = 'block';
                } else {
                    ansDiv.style.display = 'none';
                }
            });

            setupCardInteractions(card, origIndex, hiddenCards, renderCards, isHidden);

            container.appendChild(card);
        });
    }

    function cancelHideCard(origIndex) {
        hiddenCards.delete(origIndex);
        renderCards();
    }

    function shuffleCards() {
        let available = cardsData.filter(item => !hiddenCards.has(originalCardsData.indexOf(item)));
        let hidden = cardsData.filter(item => hiddenCards.has(originalCardsData.indexOf(item)));

        for (let i = available.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [available[i], available[j]] = [available[j], available[i]];
        }
        cardsData = [...available, ...hidden];
        renderCards();
    }

    function resetCards() {
        hiddenCards.clear();
        showHiddenMode = false;
        const btn = document.getElementById('toggleHiddenBtn');
        if (btn) {
            btn.style.backgroundColor = '#2c2c2c';
            btn.style.color = '#b0b0b0';
            btn.style.borderColor = '#444';
            btn.textContent = '👓 숨김 (OFF)';
        }
        cardsData = [...originalCardsData];
        renderCards();
    }

function renderEduCards() {
        const container = document.getElementById('edu-card-container');
        if (!container) return;
        const openedOriginalIndices = [];
        document.querySelectorAll('#edu-card-container > div').forEach(card => {
            const ansDiv = card.querySelector('.edu-card-answer, .edu-card-answer');
            const origIdx = card.getAttribute('data-original-index');
            if (ansDiv && ansDiv.style.display === 'block' && origIdx !== null) {
                openedOriginalIndices.push(parseInt(origIdx, 10));
            }
        });

        container.innerHTML = '';

        const searchInput = document.getElementById('searchInput');
        const searchKeyword = searchInput ? searchInput.value.toLowerCase().trim().replace(/\s+/g, '') : '';

        // 숨김 및 검색 조건에 맞는 교육학 카드 필터링
        let visibleCards = eduCardsData.filter((item) => {
            const origIndex = originalEduCardsData.indexOf(item);
            const isHidden = hiddenEduCards.has(origIndex);
            const cardText = (item.q + item.a).toLowerCase().replace(/\s+/g, '');
            const isMatch = searchKeyword === '' || cardText.includes(searchKeyword);

            if (isHidden && searchKeyword === '' && !showHiddenEduMode) return false;
            if (!isMatch) return false;
            return true;
        });

        if (visibleCards.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: #7f8c8d; padding: 20px; grid-column: 1 / -1;">조건에 맞는 카드가 없습니다!</div>`;
            return;
        }

        visibleCards.forEach((item, index) => {
            const origIndex = originalEduCardsData.indexOf(item);
            const isHidden = hiddenEduCards.has(origIndex);

            const card = document.createElement('div');
            card.setAttribute('data-original-index', origIndex);
            
            card.style.cssText = `
                background-color: #252525;
                border: ${isHidden ? '1.5px dashed #f39c12' : '1px solid #333'};
                border-radius: 8px;
                padding: 20px;
                cursor: pointer;
                transition: all 0.2s;
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                min-height: 120px;
                position: relative;
            `;
            
            card.innerHTML = `
                <div style="font-size: 13px; color: #85c1e9; margin-bottom: 8px; font-weight: bold;">
                    Q${index + 1}. ${isHidden ? '<span style="color:#f39c12; font-size:11px;">(숨김)</span>' : ''}
                </div>
                <div style="font-size: 15px; color: #ffffff; font-weight: bold; margin-bottom: 12px; text-align: center;">${item.q}</div>
                <div class="edu-card-answer" style="font-size: 14px; color: #f39c12; background-color: #1a1a1a; padding: 10px; border-radius: 4px; text-align: center; display: none; border: 1px dashed #d4ac0d; white-space: pre-line;">
                    💡 ${item.a}
                </div>
                <div style="font-size: 11px; color: #7f8c8d; text-align: center; margin-top: 8px;">클릭하여 정답 확인</div>
            `;

            const ansDiv = card.querySelector('.edu-card-answer, .edu-card-answer');

            if (openedOriginalIndices.includes(origIndex)) {
                ansDiv.style.display = 'block';
            }

            card.addEventListener('click', () => {
                if (ansDiv.style.display === 'none' || ansDiv.style.display === '') {
                    ansDiv.style.display = 'block';
                } else {
                    ansDiv.style.display = 'none';
                }
            });

            // 수교론과 공용으로 쓰는 스와이프 및 숨기기 인터랙션 함수 연결
            setupCardInteractions(card, origIndex, hiddenEduCards, renderEduCards, isHidden);

            container.appendChild(card);
        });
    }

    function shuffleEduCards() {
        let available = eduCardsData.filter(item => !hiddenEduCards.has(originalEduCardsData.indexOf(item)));
        let hidden = eduCardsData.filter(item => hiddenEduCards.has(originalEduCardsData.indexOf(item)));

        for (let i = available.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [available[i], available[j]] = [available[j], available[i]];
        }
        eduCardsData = [...available, ...hidden];
        renderEduCards();
    }

    function resetEduCards() {
        hiddenEduCards.clear();
        showHiddenEduMode = false;
        const btn = document.getElementById('toggleEduHiddenBtn');
        if (btn) {
            btn.style.backgroundColor = '#2c2c2c';
            btn.style.color = '#b0b0b0';
            btn.style.borderColor = '#444';
            btn.textContent = '👓 숨김 (OFF)';
        }
        eduCardsData = [...window.originalEduCardsData];
        renderEduCards();
    }

    let currentPedagogyCategory = '수학교과역량';

    function filterPedagogy(category, event) {
        currentPedagogyCategory = category;
        localStorage.setItem('selectedPedagogyCategory', category);

        const buttons = event.currentTarget.parentElement.querySelectorAll('.sub-tab-btn');
        buttons.forEach(btn => {
            btn.style.backgroundColor = '#2c2c2c';
            btn.style.color = '#b0b0b0';
        });
        if (event && event.currentTarget) {
            event.currentTarget.style.backgroundColor = '#3498db';
            event.currentTarget.style.color = 'white';
        }

        renderPedagogyList();
    }

    function renderPedagogyList() {
        const container = document.getElementById('pedagogy-list-container');
        if (!container) return;
        container.innerHTML = '';

        let filteredData = window.pedagogyData.filter(item => item.category === currentPedagogyCategory);
        const searchInput = document.getElementById('searchInput');
        const rawKeyword = searchInput ? searchInput.value.toLowerCase().trim() : '';
        const keyword = rawKeyword.replace(/\s+/g, '');

        if (keyword !== '') {
            let processedData = [];
            filteredData.forEach(item => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = item.content;
                tempDiv.querySelectorAll('.blank').forEach(blank => {
                    const ans = blank.getAttribute('data-answer');
                    if (ans) blank.textContent = ans;
                });

                const titleEl = tempDiv.querySelector('.concept-title');
                const titleHtml = titleEl ? titleEl.outerHTML : '';
                const pTags = tempDiv.querySelectorAll('p');

                let matchedParagraphs = [];
                pTags.forEach(p => {
                    const pText = p.textContent.toLowerCase().replace(/\s+/g, '');
                    if (pText.includes(keyword)) {
                        matchedParagraphs.push(p.outerHTML);
                    }
                });

                if (matchedParagraphs.length > 0) {
                    processedData.push({
                        title: item.title,
                        content: titleHtml + matchedParagraphs.join('')
                    });
                }
            });
            filteredData = processedData;
        }

        if (filteredData.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: #7f8c8d; padding: 20px;">현재 서브탭에 검색 결과가 없습니다.</div>`;
            return;
        }

        filteredData.forEach((item) => {
            const itemBox = document.createElement('div');
            itemBox.style.cssText = `margin-bottom: 25px;`;
            itemBox.innerHTML = `<div style="font-size: 16px; color: #ffffff; line-height: 2.2;">${item.content}</div>`;
            container.appendChild(itemBox);
        });

        if (window.renderMathInElement) {
            renderMathInElement(container, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }
    }

    let currentCategory = 'all';

    function filterFormulas(category, event) {
        currentCategory = category;
        document.querySelectorAll('.sub-tab-btn').forEach(btn => {
            btn.style.backgroundColor = '#2c2c2c';
            btn.style.color = '#b0b0b0';
        });
        if (event && event.currentTarget) {
            event.currentTarget.style.backgroundColor = '#3498db';
            event.currentTarget.style.color = 'white';
        }
        renderFormulaList();
    }

    function renderFormulaList() {
        const container = document.getElementById('formula-list-container');
        if (!container) return;
        container.innerHTML = '';

        let filteredData = currentCategory === 'all' 
            ? [...window.originalFormulaData] 
            : window.originalFormulaData.filter(item => item.category === currentCategory);

        const searchInput = document.getElementById('searchInput');
        const rawKeyword = searchInput ? searchInput.value.toLowerCase().trim() : '';
        const keyword = rawKeyword.replace(/\s+/g, '');

        if (keyword !== '') {
            filteredData = filteredData.filter(item => {
                const combinedText = (item.title + item.content).toLowerCase().replace(/\s+/g, '');
                return combinedText.includes(keyword);
            });
        }

        if (filteredData.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: #7f8c8d; padding: 20px;">해당 과목에 검색 결과가 없습니다.</div>`;
            return;
        }

        filteredData.forEach((item, index) => {
            const itemBox = document.createElement('div');
            itemBox.style.cssText = `
                background-color: #1e1e1e;
                border: 1px solid #333;
                border-left: 4px solid #3498db;
                border-radius: 6px;
                padding: 18px 20px;
                margin-bottom: 15px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            `;
            
            itemBox.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <span style="font-size: 15px; color: #5dade2; font-weight: bold;">${index + 1}. ${item.title}</span>
                    <span style="font-size: 11px; background-color: #2b3e50; color: #85c1e9; padding: 2px 8px; border-radius: 4px;">${item.category}</span>
                </div>
                <div class="formula-text" style="font-size: 16px; color: #ffffff; line-height: 2.0; padding-left: 5px;">
                    ${item.content}
                </div>
            `;
            container.appendChild(itemBox);
        });

        if (window.renderMathInElement) {
            renderMathInElement(container, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ]
            });
        }
    }

    function filterContent() {
        const rawKeyword = document.getElementById('searchInput').value.toLowerCase().trim();
        const keyword = rawKeyword.replace(/\s+/g, '');
        renderCards();
        renderEduCards();
        if (keyword === '') {
            if (typeof renderPedagogyList === 'function') renderPedagogyList();
            document.querySelectorAll('#card-container > div, #edu-card-container > div, #formula-list-container > div').forEach(el => {
                el.style.display = el.closest('#card-container, #edu-card-container') ? 'flex' : 'block';
            });
            document.querySelectorAll('.tab-content:not(#tab1):not(#tab-edumath):not(#tab-edu):not(#tab-math) p').forEach(p => {
                p.style.display = 'block';
            });
            return;
        }

        const pedagogyContainer = document.getElementById('pedagogy-list-container');
        if (pedagogyContainer && document.getElementById('tab1').classList.contains('active')) {
            pedagogyContainer.innerHTML = '';
            let currentSubData = window.pedagogyData.filter(item => item.category === currentPedagogyCategory);
            let processedData = [];

            currentSubData.forEach(item => {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = item.content;
                tempDiv.querySelectorAll('.blank').forEach(blank => {
                    const ans = blank.getAttribute('data-answer');
                    if (ans) blank.textContent = ans;
                });

                const titleEl = tempDiv.querySelector('.concept-title');
                const titleHtml = titleEl ? titleEl.outerHTML : '';
                const pTags = tempDiv.querySelectorAll('p');

                let matchedParagraphs = [];
                pTags.forEach(p => {
                    const cleanText = p.textContent.toLowerCase().replace(/\s+/g, '');
                    if (cleanText.includes(keyword)) {
                        matchedParagraphs.push(p.outerHTML);
                    }
                });

                if (matchedParagraphs.length > 0) {
                    processedData.push({ content: titleHtml + matchedParagraphs.join('') });
                }
            });

            if (processedData.length > 0) {
                processedData.forEach(item => {
                    const itemBox = document.createElement('div');
                    itemBox.style.cssText = `margin-bottom: 25px;`;
                    itemBox.innerHTML = `<div style="font-size: 16px; color: #ffffff; line-height: 2.2;">${item.content}</div>`;
                    pedagogyContainer.appendChild(itemBox);
                });
                if (window.renderMathInElement) {
                    renderMathInElement(pedagogyContainer, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] });
                }
            } else {
                pedagogyContainer.innerHTML = `<div style="text-align: center; color: #7f8c8d; padding: 20px;">현재 서브탭에 검색 결과가 없습니다.</div>`;
            }
        }

        document.querySelectorAll('#card-container > div, #edu-card-container > div, #formula-list-container > div').forEach(item => {
            const clone = item.cloneNode(true);
            clone.querySelectorAll('.blank').forEach(b => {
                const ans = b.getAttribute('data-answer');
                if (ans) b.textContent = ans;
            });
            const text = clone.textContent.toLowerCase().replace(/\s+/g, '');
            item.style.display = text.includes(keyword) ? (item.closest('#card-container, #edu-card-container') ? 'flex' : 'block') : 'none';
        });

        document.querySelectorAll('.tab-content:not(#tab1):not(#tab-edumath):not(#tab-edu):not(#tab-math) p').forEach(p => {
            const clone = p.cloneNode(true);
            clone.querySelectorAll('.blank').forEach(b => {
                const ans = b.getAttribute('data-answer');
                if (ans) b.textContent = ans;
            });
            const text = clone.textContent.toLowerCase().replace(/\s+/g, '');
            p.style.display = text.includes(keyword) ? 'block' : 'none';
        });
    }

    let hiddenCards = new Set();
    let showHiddenEduMode = false;
    let hiddenEduCards = new Set();

    function toggleShowHiddenEduCards() {
        showHiddenEduMode = !showHiddenEduMode;
        const btn = document.getElementById('toggleEduHiddenBtn');
        if (showHiddenEduMode) {
            btn.style.backgroundColor = '#3498db';
            btn.style.color = 'white';
            btn.style.borderColor = '#3498db';
            btn.textContent = '👓 숨김 (ON)';
        } else {
            btn.style.backgroundColor = '#2c2c2c';
            btn.style.color = '#b0b0b0';
            btn.style.borderColor = '#444';
            btn.textContent = '👓 숨김 (OFF)';
        }
        
        const openedAnswers = [];
        document.querySelectorAll('#edu-card-container > div').forEach((card) => {
            const ansDiv = card.querySelector('.edu-card-answer, .edu-card-answer');
            if (ansDiv && ansDiv.style.display === 'block') {
                openedAnswers.push(card.getAttribute('data-original-index'));
            }
        });

        renderEduCards();
        document.querySelectorAll('#edu-card-container > div').forEach(card => {
            const origIdx = card.getAttribute('data-original-index');
            if (origIdx !== null && openedAnswers.includes(origIdx)) {
                const ansDiv = card.querySelector('.edu-card-answer, .edu-card-answer');
                if (ansDiv) ansDiv.style.display = 'block';
            }
        });
    }

    // 카드 인터랙션(모바일 스와이프 + PC X버튼) 설정 함수
    function setupCardInteractions(cardElement, origIndex, hiddenSet, renderCallback, isHidden = false) {
        cardElement.classList.add('swipeable-card');

        const actionBtn = document.createElement('button');
        actionBtn.innerHTML = isHidden ? '↩️' : '×';
        actionBtn.title = isHidden ? '숨기기 취소' : '숨기기';
        actionBtn.style.cssText = `
            position: absolute; 
            top: 8px; 
            right: 8px; 
            background: transparent; 
            border: none; 
            color: ${isHidden ? '#f39c12' : '#7f8c8d'}; 
            font-size: ${isHidden ? '14px' : '18px'}; 
            font-weight: bold; 
            cursor: pointer; 
            width: 24px; 
            height: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 4px; 
            z-index: 10;
        `;

        actionBtn.onclick = (e) => {
            e.stopPropagation();
            const openedOriginalIndices = [];
            document.querySelectorAll('#card-container > div').forEach(card => {
                const ans = card.querySelector('.card-answer, .edu-card-answer');
                const origIdx = card.getAttribute('data-original-index');
                if (ans && ans.style.display === 'block' && origIdx !== null) {
                    openedOriginalIndices.push(parseInt(origIdx, 10));
                }
            });

            if (isHidden) {
                hiddenSet.delete(origIndex);
            } else {
                hiddenSet.add(origIndex);
                cardElement.classList.add('swiped-out');
            }
            
            setTimeout(() => {
                renderCallback();
                document.querySelectorAll('#card-container > div').forEach(card => {
                    const origIdx = card.getAttribute('data-original-index');
                    if (origIdx !== null && openedOriginalIndices.includes(parseInt(origIdx, 10))) {
                        const ans = card.querySelector('.card-answer, .edu-card-answer');
                        if (ans) ans.style.display = 'block';
                    }
                });
            }, 300);
        };
        cardElement.appendChild(actionBtn);

        // 모바일 터치 스와이프
        if (!isHidden) {
            let startX = 0;
            let startY = 0;
            let currentX = 0;
            let currentY = 0;
            let isDragging = false;
            let isHorizontalSwipe = false;

            cardElement.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                currentX = startX;
                currentY = startY;
                isDragging = true;
                isHorizontalSwipe = false;
            }, {passive: true});

            cardElement.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
                let diffX = currentX - startX;
                let diffY = currentY - startY;

                if (!isHorizontalSwipe && (Math.abs(diffX) > 10 || Math.abs(diffY) > 10)) {
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        isHorizontalSwipe = true;
                    } else {
                        isDragging = false;
                        return;
                    }
                }

                if (isHorizontalSwipe && diffX < 0) {
                    cardElement.style.transform = `translateX(${diffX}px)`;
                }
            }, {passive: true});

            cardElement.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                let diffX = currentX - startX;
                
                if (isHorizontalSwipe && diffX < -100) {
                    const openedOriginalIndices = [];
                    document.querySelectorAll('#card-container > div').forEach(card => {
                        const ans = card.querySelector('.card-answer, .edu-card-answer');
                        const origIdx = card.getAttribute('data-original-index');
                        if (ans && ans.style.display === 'block' && origIdx !== null) {
                            openedOriginalIndices.push(parseInt(origIdx, 10));
                        }
                    });

                    hiddenSet.add(origIndex);
                    cardElement.classList.add('swiped-out');
                    
                    setTimeout(() => {
                        renderCallback();
                        document.querySelectorAll('#card-container > div').forEach(card => {
                            const origIdx = card.getAttribute('data-original-index');
                            if (origIdx !== null && openedOriginalIndices.includes(parseInt(origIdx, 10))) {
                                const ans = card.querySelector('.card-answer, .edu-card-answer');
                                if (ans) ans.style.display = 'block';
                            }
                        });
                    }, 300);
                } else {
                    cardElement.style.transform = 'translateX(0px)';
                }
                startX = 0;
                startY = 0;
                currentX = 0;
                currentY = 0;
                isHorizontalSwipe = false;
            });
        }
    }
</script>
